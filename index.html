<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Задачник</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="head">
      <h1>Задачник</h1>
      <p id="counter" class="counter" aria-live="polite"></p>
    </header>

    <form id="task-form" class="add" autocomplete="off">
      <label class="visually-hidden" for="task-input">Новая задача</label>
      <input id="task-input" type="text" maxlength="120" placeholder="Что нужно сделать?" required>
      <button type="submit">Добавить</button>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <nav class="filters" aria-label="Фильтр задач">
      <button type="button" class="filter active" data-filter="all" aria-pressed="true">Все</button>
      <button type="button" class="filter" data-filter="active" aria-pressed="false">Активные</button>
      <button type="button" class="filter" data-filter="done" aria-pressed="false">Выполненные</button>
    </nav>

    <ul id="task-list" class="list"></ul>
    <p id="empty" class="empty" hidden>Список пуст. Введите первую задачу выше.</p>

    <footer class="foot">
      <button id="clear-done" type="button" class="link">Удалить выполненные</button>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
